<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Change password</title>
  </head>
  <body>
    <!-- Marked up as the HTML standard recommends. -->
    <form id="marked">
      <input id="current" type="password" autocomplete="current-password">
      <input id="new" type="password" autocomplete="new-password">
      <input id="confirm" type="password" autocomplete="new-password">
    </form>
    <!-- The same form as many sites write it, without any hint. -->
    <form id="bare">
      <input id="bare-current" type="password">
      <input id="bare-new" type="password">
      <input id="bare-confirm" type="password">
    </form>
  </body>
</html>
