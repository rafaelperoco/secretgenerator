<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Password fields without a form</title>
  </head>
  <body>
    <!-- Two unrelated password fields that happen to follow each other,
         as on a settings page built from separate widgets. -->
    <input id="loose" type="password">
    <input id="neighbour" type="password">
    <form>
      <input id="in-form" type="password">
    </form>
  </body>
</html>
