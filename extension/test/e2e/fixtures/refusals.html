<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Fields that cannot be filled</title>
    <script src="/events.js"></script>
  </head>
  <body>
    <input id="readonly" type="password" readonly>
    <!-- Still focusable, but nothing a user can see. -->
    <input id="transparent" type="password">
    <input id="checkbox" type="checkbox">
    <input id="number" type="number">
    <button id="button" type="button">A button</button>
    <!-- A site that rewrites what is entered. -->
    <input id="uppercase" type="text">
    <script>
      document.getElementById("transparent").style.opacity = "0";
      document.getElementById("uppercase").addEventListener("input", (event) => {
        event.target.value = event.target.value.toUpperCase();
      });
    </script>
  </body>
</html>
