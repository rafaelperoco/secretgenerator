<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Length limits</title>
  </head>
  <body>
    <form>
      <input id="pw16" type="password" maxlength="16">
      <input id="pw16-confirm" type="password" maxlength="16">
    </form>
    <!-- Shorter than the core generates with the default settings. -->
    <form>
      <input id="pw8" type="password" maxlength="8">
      <input id="pw8-confirm" type="password" maxlength="8">
    </form>
  </body>
</html>
